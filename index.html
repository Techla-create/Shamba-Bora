<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shamba Bora</title><script>try{var t=localStorage.getItem("gpd_theme")||"light";if(t!=="auto")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#228B22"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<style>
:root{--g:#228B22;--dg:#14532D;--lg:#E8F5E9;--bg:#F7FAF7;--card:#fff;--tx:#1F2937;--bd:#DCE7DC;--warn:#b45309;--err:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--lg:#16301b;--bg:#0f1a12;--card:#16231a;--tx:#e5efe6;--bd:#2a3d2e;--dg:#7bd88a;color-scheme:dark}}
:root[data-theme="dark"]{--lg:#16301b;--bg:#0f1a12;--card:#16231a;--tx:#e5efe6;--bd:#2a3d2e;--dg:#7bd88a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}
nav{background:var(--card);border-right:1px solid var(--bd);width:220px;padding:16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--dg);margin-bottom:14px}
nav button{all:unset;cursor:pointer;padding:12px 14px;border-radius:12px;font-weight:600;display:flex;gap:10px}
nav button.on{background:var(--g);color:#fff}
nav button:not(.on):hover{background:var(--lg)}
main{flex:1;padding:20px;max-width:980px;margin:0 auto;width:100%}
h1{color:var(--dg);font-size:1.5rem;margin:0 0 4px}.sub{color:#6b7f6e;margin:0 0 16px;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.stat b{display:block;font-size:1.6rem;color:var(--g)}.stat span{font-size:.82rem;color:#6b7f6e}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:13px 18px;font-size:1rem;font-weight:700;cursor:pointer}
.btn.alt{background:var(--lg);color:var(--dg)}
input,select{font:inherit;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:100%}
label{font-size:.85rem;font-weight:600;display:block;margin-bottom:4px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px}
.cow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.cow:last-child{border:0}.cow .n{flex:1}.cow input{width:110px;text-align:right}
.tag{font-size:.75rem;padding:3px 9px;border-radius:99px;background:var(--lg);color:var(--dg);font-weight:700}
.tag.miss{background:#fef3c7;color:var(--warn)}
.msg{padding:10px 14px;border-radius:10px;margin-bottom:12px;background:var(--lg);color:var(--dg);font-weight:600}
.msg.err{background:#fee2e2;color:var(--err)}
.note{font-size:.8rem;color:#6b7f6e;margin-top:14px}
svg text{fill:var(--tx);font-size:11px}
.bar{display:none}.tag:empty{display:none}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:10px 0}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:right}th:first-child,td:first-child{text-align:left}th{background:var(--lg);color:var(--dg)}tfoot td{font-weight:700;border-top:2px solid var(--g)}.wrap{overflow-x:auto}
.lh{border-bottom:3px solid var(--g);padding-bottom:10px;margin-bottom:14px;display:flex;gap:12px;align-items:center}.lh h2{margin:0;color:var(--dg)}.lh small{color:#6b7f6e;display:block}
@media print{:root:root:root{--card:#fff;--bg:#fff;--tx:#000;--bd:#ccc;--dg:#14532D;--lg:#E8F5E9}nav,.noprint,.msg,.tb,#ov{display:none!important}main{padding:0;max-width:none}.card{border:0;padding:0}}
.tb{display:none;position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 0 10px;align-items:center;gap:12px}#ov{display:none}
@media(max-width:720px){
nav{position:fixed;top:0;left:0;bottom:0;right:auto;width:80%;max-width:300px;height:auto;flex-direction:column;border:0;border-right:1px solid var(--bd);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-105%);transition:transform .25s;z-index:40;overflow-y:auto}
nav.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
#ov.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
.tb{display:flex}main{padding:12px 14px 40px}.bar{display:block}}
#splash{position:fixed;inset:0;background:#fff;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s}#splash img{width:200px;max-width:60%}#splash .pb{width:220px;max-width:70%;height:10px;background:#E8F5E9;border-radius:99px;overflow:hidden}#splash .pb i{display:block;height:100%;width:0;background:#228B22;border-radius:99px;transition:width .25s}#splash b{color:#14532D;font:600 .95rem system-ui,sans-serif}
</style></head><body>
<div id="splash"><img src="logo.png" alt=""><div class="pb"><i id="spb"></i></div><b id="spt">0%</b></div>
<script>var spl=function(p){var b=document.getElementById("spb"),t=document.getElementById("spt");if(b)b.style.width=p+"%";if(t)t.textContent=p+"%"};spl(10);</script>
<div class="app">
<div id="ov" onclick="menu(0)"></div><nav id="nav"></nav>
<main id="main"></main>
</div>
<script src="config.js"></script>
<script>
spl(35);const APP_VERSION="1.3.2";const SESS=["Morning","Afternoon","Evening"];
const today=()=>new Date().toISOString().slice(0,10);
let S={cows:[],milk:{},audit:[]},view="dash",msg=null,mDate=today(),mSess="Morning",online=navigator.onLine;
let U=null,authMode="login";
const users=()=>{try{return JSON.parse(localStorage.getItem("gpd_users")||"[]")}catch(e){return[]}};
const b64=b=>{const a=new Uint8Array(b);let t="";for(let i=0;i<a.length;i+=8192)t+=String.fromCharCode(...a.subarray(i,i+8192));return btoa(t)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function hashPw(pw,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);return b64(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:150000},k,256))}
function loadUser(u){U=u;S={cows:[],milk:{},audit:[]};try{const d=localStorage.getItem("gpd_"+u.id);if(d)S=JSON.parse(d)}catch(e){}S.rec=S.rec||{};S.farm=S.farm||{name:u.farm,addr:"",phone:"",email:""};localStorage.setItem("gpd_cur",u.id)}
function logout(){U=null;localStorage.removeItem("gpd_cur");localStorage.removeItem("gpd_tk");TK=null;msg=null;view="dash";render()}
const aerr=t=>{document.getElementById("am").innerHTML=`<div class="msg err">${esc(t)}</div>`};
function authView(){document.getElementById("nav").innerHTML="";if(authMode==="restore")return restoreView();if(CLOUD&&authMode==="admin")return admLogin();if(CLOUD&&authMode==="forgot")return forgotView();if(CLOUD)return cloudAuth();const reg=authMode==="reg",f=(id,l,t)=>`<div style="margin-bottom:12px"><label>${l}</label><input id="${id}" type="${t||"text"}" autocomplete="${t==="password"?(reg?"new-password":"current-password"):"off"}"></div>`;
document.getElementById("main").innerHTML=`<div style="max-width:380px;margin:6vh auto"><div style="text-align:center;margin-bottom:16px">${logoBig}<h1>Shamba Bora</h1><p class="sub">${reg?"Create your farm account":"Log in to your farm"}</p></div><div id="am"></div>${bioBtns()}<div class="card">${reg?f("rf","Farm name")+f("rn","Your name")+f("re","Email for backups (optional)","email"):""}${f("ru","Username")}${f("rp",reg?"Password (6+ characters)":"Password","password")}<button class="btn" style="width:100%" onclick="${reg?"doReg()":"doLogin()"}">${reg?"Create account":"Log in"}</button></div><p style="text-align:center"><a href="#" onclick="authMode='${reg?"login":"reg"}';render();return false" style="color:var(--g);font-weight:600">${reg?"I already have an account":"Create a new account"}</a></p><p style="text-align:center"><a href="#" onclick="authMode='restore';render();return false" style="color:var(--g);font-weight:600">Restore from backup file</a></p><p class="note">Works offline. Accounts are kept on this phone until cloud sync is connected.</p></div>`}
async function aesKey(pw,salt,use){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt,iterations:150000},k,{name:"AES-GCM",length:256},false,use)}
async function makeBackup(pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await aesKey(pw,salt,["encrypt"]);
const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify({user:{...U,bio:undefined},data:S})));
return JSON.stringify({app:"gpd",v:1,salt:b64(salt),iv:b64(iv),ct:b64(ct)})}
async function doBackup(){const pw=document.getElementById("bp").value;if(U.email&&navigator.clipboard)navigator.clipboard.writeText(U.email).catch(()=>{});
if(!pw||(await hashPw(pw,U.salt))!==U.hash){msg={t:"Wrong password.",e:1};return render()}
const txt=await makeBackup(pw),name="dairy-backup-"+today()+".gpdbackup",file=new File([txt],name,{type:"application/octet-stream"});
try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:"Farm backup "+today()+(S.farm&&S.farm.name?" - "+S.farm.name:"")});else throw 0}
catch(e){if(e&&e.name==="AbortError")return;const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;a.click()}
S.lastBackup=new Date().toISOString();save();msg={t:U.email?"Backup file ready. Choose Gmail and send it to "+U.email+" (the address is copied, so just paste it in the To box).":"Backup file created. Add your email below so you know where to send it next time."};render()}
function restoreView(){document.getElementById("main").innerHTML=`<div style="max-width:380px;margin:6vh auto"><div style="text-align:center;margin-bottom:16px">${logoBig}<h1>Restore account</h1><p class="sub">Choose your backup file and enter its password</p></div><div id="am"></div><div class="card"><div style="margin-bottom:12px"><label>Backup file</label><input id="rfile" type="file"></div><div style="margin-bottom:12px"><label>Password</label><input id="rp" type="password"></div><button class="btn" style="width:100%" onclick="doRestore()">Restore and log in</button></div><p style="text-align:center"><a href="#" onclick="authMode='login';render();return false" style="color:var(--g);font-weight:600">Back to login</a></p></div>`}
async function doRestore(){const f=document.getElementById("rfile").files[0],pw=document.getElementById("rp").value;
if(!f||!pw)return aerr("Choose the file and enter the password.");
try{const j=JSON.parse(await f.text());if(j.app!=="gpd")throw 0;
const key=await aesKey(pw,unb64(j.salt),["decrypt"]),p=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(j.iv)},key,unb64(j.ct))));
const us=users(),old=us.find(x=>x.id===p.user.id);
if(us.some(x=>x.user===p.user.user&&x.id!==p.user.id))return aerr("Another account on this phone already uses that username.");
if(old&&!confirm("This account is already on this phone. Replace it with the backup?"))return;
const u={...p.user,bio:old?old.bio:undefined};
localStorage.setItem("gpd_users",JSON.stringify([...us.filter(x=>x.id!==u.id),u]));localStorage.setItem("gpd_"+u.id,JSON.stringify(p.data));
authMode="login";msg={t:"Account restored."};loadUser(u);render()}
catch(e){aerr("Could not open the file. Check the password and that it is a farm backup file.")}}
const saveUser=()=>localStorage.setItem("gpd_users",JSON.stringify(users().map(x=>x.id===U.id?U:x)));
const bioBtns=()=>authMode==="login"?users().filter(u=>u.bio).map(u=>`<button class="btn" style="width:100%;margin-bottom:12px" onclick="bioLogin('${u.id}')">\ud83d\udc46 Unlock as ${esc(u.name)}</button>`).join(""):"";
async function bioLogin(id){const u=users().find(x=>x.id===id);try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:"public-key",id:unb64(u.bio)}],userVerification:"required",timeout:60000}});loadUser(u);render()}catch(e){aerr("Fingerprint or face was not confirmed. Use your password instead.")}}
async function bioOn(){const pw=document.getElementById("bp").value;
if(!pw||(await hashPw(pw,U.salt))!==U.hash){msg={t:"Wrong password.",e:1};return render()}
try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"Shamba Bora",id:location.hostname},user:{id:new TextEncoder().encode(U.id),name:U.user,displayName:U.name},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},timeout:60000}});
U.bio=b64(c.rawId);saveUser();msg={t:"Fingerprint unlock is on. The app will ask for it each time it is opened."}}
catch(e){msg={t:"Could not turn on fingerprint unlock. Check that a fingerprint or face is set up on this phone.",e:1}}render()}
function bioOff(){delete U.bio;saveUser();msg={t:"Fingerprint unlock is off."};render()}
function secCard(){const bio=!!U.bio;return `<div class="card" style="margin-top:16px"><h3 style="margin-top:0;color:var(--dg)">Backup and security</h3><div style="margin-bottom:12px"><label>Backup email (your Gmail)</label><input id="be" type="email" value="${esc(U.email||"")}" onchange="setEmail(this.value)"></div><div style="margin-bottom:12px"><label>Confirm your password</label><input id="bp" type="password" autocomplete="current-password"></div>
<p class="note" style="margin:0 0 12px">${S.lastBackup?"Last backup: "+new Date(S.lastBackup).toLocaleString():"No backup made yet."} The file is locked with your password. If you forget the password, it cannot be opened.</p>
<button class="btn" onclick="doBackup()">\ud83d\udcbe Save encrypted backup</button>
<hr style="border:0;border-top:1px solid var(--bd);margin:16px 0">
${window.PublicKeyCredential?`<p style="margin:0 0 10px">Fingerprint / face unlock: <b>${bio?"On":"Off"}</b></p><button class="btn alt" onclick="${bio?"bioOff()":"bioOn()"}">${bio?"Turn off":"Turn on fingerprint unlock"}</button><p class="note">When on, the app asks for your fingerprint or face each time it is opened. Your password still works as a fallback.</p>`:`<p class="note">This browser does not support fingerprint unlock.</p>`}</div>`}
function bkNote(){const l=S.lastBackup,d=l?Math.floor((Date.now()-new Date(l))/864e5):null;if(l&&d<2)return"";return `<div class="msg" style="background:#fef3c7;color:var(--warn);cursor:pointer" onclick="go('settings')">${l?"Last backup was "+d+" days ago":"No backup yet"}. Tap here to back up${U.email?" to "+esc(U.email):""}.</div>`}
function setEmail(v){v=v.trim();if(v&&!/^\S+@\S+\.\S+$/.test(v)){alert("That email address does not look right.");return}U.email=v;saveUser()}
const needBk=()=>!S.lastBackup||S.lastBackup.slice(0,10)!==today();
const CFG=window.CFG||{},CLOUD=!!(CFG.url&&CFG.key&&!/YOURPROJECT|YOUR_/.test(CFG.url+CFG.key));
let TK=null,pendMsg=null,syncing=false,syncErr="";
async function api(path,o){o=o||{};const h={apikey:CFG.key,"Content-Type":"application/json"};if(TK&&!o.anon)h.Authorization="Bearer "+TK.access_token;if(o.h)Object.assign(h,o.h);
const r=await fetch(CFG.url+path,{method:o.m||"GET",headers:h,body:o.b?JSON.stringify(o.b):undefined}),t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
if(!r.ok)throw new Error((j&&(j.msg||j.message||j.error_description||j.error))||"Error "+r.status);return j}
const rpc=(fn,b)=>api("/rest/v1/rpc/"+fn,{m:"POST",b:b||{}});
const saveTk=j=>{TK={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600)};localStorage.setItem("gpd_tk",JSON.stringify(TK))};
async function ensureTk(){if(!TK)try{TK=JSON.parse(localStorage.getItem("gpd_tk")||"null")}catch(e){}if(!TK)return false;if(TK.expires_at*1000>Date.now()+60000)return true;
try{saveTk(await api("/auth/v1/token?grant_type=refresh_token",{m:"POST",b:{refresh_token:TK.refresh_token},anon:1}));return true}catch(e){return false}}
const netErr=e=>e instanceof TypeError;
function cloudAuth(){const reg=authMode==="reg",f=(id,l,t)=>`<div style="margin-bottom:12px"><label>${l}</label><input id="${id}" type="${t||"text"}" autocomplete="off"></div>`;
const body=pendMsg?`<div class="card"><p><b>${esc(pendMsg)}</b></p></div>`:`<div class="card">${reg?f("rn","Your name")+`<div style="margin-bottom:12px"><label>I am</label><select id="rk" onchange="rkChange()"><option value="owner">A farm owner (new farm)</option><option value="worker">A worker joining a farm</option></select></div><div id="rkb" style="margin-bottom:12px"><label>Farm name</label><input id="rf"></div>`:""}${f("re","Email","email")}${f("rp","Password"+(reg?" (6+ characters)":""),"password")}<button class="btn" style="width:100%" onclick="${reg?"cloudReg()":"cloudLogin()"}">${reg?"Create account":"Log in"}</button>${reg?"":`<p style="text-align:center;margin:12px 0 0"><a href="#" onclick="authMode='forgot';render();return false" style="color:var(--g);font-weight:600">Forgot password?</a></p>`}</div>`;
const lk=(a,t)=>`<p style="text-align:center"><a href="#" onclick="${a};render();return false" style="color:var(--g);font-weight:600">${t}</a></p>`;
document.getElementById("nav").innerHTML="";
document.getElementById("main").innerHTML=`<div style="max-width:380px;margin:6vh auto"><div style="text-align:center;margin-bottom:16px">${logoBig}<h1>Shamba Bora</h1><p class="sub">${reg?"Create your account. An administrator must approve it before you can use it.":"Log in to your farm"}</p></div><div id="am"></div>${pendMsg?"":bioBtns()}${body}${pendMsg?lk("pendMsg=null;authMode='login'","Back to login"):lk("authMode='"+(reg?"login":"reg")+"'",reg?"I already have an account":"Create a new account")+lk("authMode='restore'","Restore from backup file")+lk("authMode='admin'","Administrator login")}<p class="note">After your first login on a phone, the app also works offline. Version ${APP_VERSION}.</p></div>`}
function rkChange(){document.getElementById("rkb").innerHTML=document.getElementById("rk").value==="owner"?'<label>Farm name</label><input id="rf">':'<label>Farm code</label><input id="rf" placeholder="e.g. GRE-4K7Q" style="text-transform:uppercase">'}
async function runIntent(email){const t=localStorage.getItem("gpd_intent");if(!t)return;const i=JSON.parse(t);if(i.email!==email)return;localStorage.removeItem("gpd_intent");await rpc("dairy_register",{p_name:i.name,p_farm:i.farm||null,p_code:i.code||null})}
const redirQ=()=>{if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())return"";return"?redirect_to="+encodeURIComponent(CFG.site||location.origin+location.pathname.replace(/[^\/]*$/,""))};
async function cloudReg(){const g=i=>(document.getElementById(i)||{value:""}).value.trim(),kind=g("rk"),email=g("re").toLowerCase(),p=document.getElementById("rp").value,nm=g("rn"),fv=g("rf");
if(!nm||!email||!fv||p.length<6)return aerr("Fill in every field. The password needs 6 or more characters.");
if(!/^\S+@\S+\.\S+$/.test(email))return aerr("That email address does not look right.");
if(!navigator.onLine)return aerr("You need internet to create an account.");
localStorage.setItem("gpd_intent",JSON.stringify({email,name:nm,farm:kind==="owner"?fv:"",code:kind==="worker"?fv.toUpperCase():""}));
try{const j=await api("/auth/v1/signup"+redirQ(),{m:"POST",b:{email,password:p},anon:1});
if(j&&j.access_token){saveTk(j);await runIntent(email);const me=await rpc("dairy_me");return enter(me,email,p)}
pendMsg="Account created. Check your email and confirm it, then log in here. After that an administrator must approve you.";render()}
catch(e){aerr(netErr(e)?"No connection. Try again when you have internet.":/already/i.test(e.message)?"This email already has an account. Use Log in and your farm details will be added.":e.message)}}
async function cloudLogin(){const email=document.getElementById("re").value.trim().toLowerCase(),p=document.getElementById("rp").value;
if(!email||!p)return aerr("Enter your email and password.");
if(!window.crypto||!crypto.subtle)return aerr("Secure login needs the HTTPS link of the app.");
if(!navigator.onLine)return offlineLogin(email,p);
try{saveTk(await api("/auth/v1/token?grant_type=password",{m:"POST",b:{email,password:p},anon:1}))}
catch(e){return netErr(e)?offlineLogin(email,p):aerr(/invalid|credentials/i.test(e.message)?"Wrong email or password.":e.message)}
try{await runIntent(email);enter(await rpc("dairy_me"),email,p)}catch(e){aerr(e.message)}}
async function offlineLogin(email,p){const u=users().find(x=>x.user===email&&x.sb);
if(!u)return aerr("No internet. Log in online once on this phone first.");
if((await hashPw(p,u.salt))!==u.hash)return aerr("Wrong email or password.");loadUser(u);render()}
async function enter(me,email,p){const ms=me.memberships||[],m=ms.find(x=>x.status==="active")||ms[0],stop=t=>{pendMsg=t;render()};
if(me.status==="none")return stop("Registration is incomplete. Choose Create a new account, enter the same email, and finish the form.");
if(me.status==="rejected")return stop("Your account was not approved. Please contact the administrator.");
if(me.status!=="approved")return stop("Your account is waiting for the administrator to approve it. Try logging in again later.");
if(me.is_admin&&!ms.some(x=>x.status==="active")){admOn=true;pendMsg=null;await admLoad();return}
if(!m)return stop("Your account is approved but is not linked to a farm yet. Contact the farm owner.");
