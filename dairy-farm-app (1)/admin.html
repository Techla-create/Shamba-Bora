<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shamba Bora administrator</title><script src="config.js"></script>
<style>body{font:16px system-ui,sans-serif;background:#F7FAF7;color:#1F2937;margin:0}main{max-width:900px;margin:0 auto;padding:20px}h1{color:#14532D}input,select{font:inherit;padding:10px;border:1px solid #DCE7DC;border-radius:10px;width:100%;margin-bottom:10px;box-sizing:border-box}button{background:#228B22;color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;margin:2px}button.n{background:#E8F5E9;color:#14532D}.c{background:#fff;border:1px solid #DCE7DC;border-radius:14px;padding:14px;margin-bottom:10px}.t{font-size:.75rem;padding:2px 9px;border-radius:99px;background:#E8F5E9;color:#14532D;font-weight:700}.w{background:#fef3c7;color:#b45309}.e{color:#b91c1c;font-weight:600}</style></head><body><main id="m"></main>
<script>
const C=window.CFG||{};let T=null,F="pending",L=[];
const $=s=>document.getElementById(s),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(p,b){const h={apikey:C.key,"Content-Type":"application/json"};if(T)h.Authorization="Bearer "+T;const r=await fetch(C.url+p,{method:"POST",headers:h,body:JSON.stringify(b||{})}),t=await r.text();let j=null;try{j=JSON.parse(t)}catch(e){}if(!r.ok)throw new Error((j&&(j.msg||j.message||j.error_description))||"Error "+r.status);return j}
function login(msg){$("m").innerHTML=`<h1>Shamba Bora administrator</h1>${msg?`<p class="e">${esc(msg)}</p>`:""}<div class="c"><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password"><button onclick="go()">Log in</button></div>`}
async function go(){try{const j=await api("/auth/v1/token?grant_type=password",{email:$("e").value.trim(),password:$("p").value});T=j.access_token;const me=await api("/rest/v1/rpc/dairy_me");if(!me.is_admin||me.status!=="approved"){T=null;return login("This account is not an administrator.")}await load()}catch(e){login(e.message)}}
async function load(){try{L=await api("/rest/v1/rpc/dairy_admin_list");draw()}catch(e){login(e.message)}}
async function setSt(id,s){try{await api("/rest/v1/rpc/dairy_admin_set",{p_user:id,p_status:s});await load()}catch(e){alert(e.message)}}
function draw(){const a=L.filter(x=>F==="all"||x.status===F);$("m").innerHTML=`<h1>Shamba Bora administrator</h1><p><select onchange="F=this.value;draw()">${["pending","approved","rejected","all"].map(s=>`<option ${s===F?"selected":""}>${s}</option>`).join("")}</select></p>${a.map(x=>`<div class="c"><b>${esc(x.name)}</b> <span class="t ${x.status==="pending"?"w":""}">${x.status}</span><br>${esc(x.email)}<br><small>Registered ${new Date(x.created).toLocaleString()}</small><br>${x.farms.map(f=>`<small>${esc(f.name)} (${esc(f.code)}) · ${f.role} · ${f.mstatus}</small>`).join("<br>")}<div style="margin-top:8px">${x.status!=="approved"?`<button onclick="setSt('${x.id}','approved')">Approve</button>`:""}${x.status!=="rejected"?`<button class="n" onclick="setSt('${x.id}','rejected')">Reject</button>`:""}</div></div>`).join("")||"<p>Nothing here.</p>"}`}
login();
</script></body></html>
